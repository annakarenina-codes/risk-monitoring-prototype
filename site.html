<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sites & zones · Risk Management Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <h1 id="site-title">Site</h1>
      <span class="muted" id="site-area"></span>
      <span class="spacer"></span>
      <select class="input" id="site-select" style="width:auto"></select>
    </div>

    <div class="grid-site">
      <section class="card plan-card">
        <div class="plan-toolbar" id="toolbar"></div>
        <svg class="plan" id="plan" viewBox="-1 -1 102 62">
          <g id="plan-base"></g>
          <g id="plan-people"></g>
        </svg>
        <div class="legend">
          <span><i class="sw" style="background:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%224%22 height=%224%22><rect width=%224%22 height=%224%22 fill=%22%23efeaff%22/><path d=%22M0 4L4 0%22 stroke=%22%236a4ae0%22/></svg>');border:1px solid var(--violet)"></i>Private: location not shared</span>
          <span><i class="sw" style="background:var(--red-50);border:1px dashed var(--red)"></i>Restricted: alert on visitors</span>
          <span><i class="sw" style="background:var(--blue-50);border:1px solid var(--blue)"></i>General area</span>
          <span><i class="sw" style="background:var(--blue);border-radius:50%;width:10px"></i>Employee</span>
          <span><i class="sw" style="background:#e08a00;border-radius:50%;width:10px"></i>Visitor</span>
          <span><i class="sw" style="background:#0e8f8f;border-radius:50%;width:10px"></i>Driver</span>
          <span><i class="sw" style="background:#3b3f5c;border-radius:50%;width:10px"></i>Guard</span>
        </div>
      </section>

      <aside class="card">
        <div class="tabs" style="padding-top:14px" id="side-tabs">
          <button class="tab active" data-tab="zones">Zones</button>
          <button class="tab" data-tab="people">People here</button>
        </div>
        <div id="side"></div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/live.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
