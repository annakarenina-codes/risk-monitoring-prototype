<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Configure · Risk Management Monitoring System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header id="topbar"></header>

  <main class="page">
    <div class="page-head">
      <h1 id="site-title">Site</h1>
      <span class="muted" id="site-area"></span>
      <span class="spacer"></span>
      <select class="input" id="site-select" style="width:auto"></select>
    </div>

    <div class="grid-site">
      <section class="card plan-card">
        <div class="plan-toolbar" id="toolbar"></div>
        <svg class="plan editable" id="plan" viewBox="-1 -1 102 62">
          <g id="plan-base"></g>
          <g id="plan-people"></g>
        </svg>
        <div class="legend">
          <span><i class="sw private"></i>Private: location not shared</span>
          <span><i class="sw restricted"></i>Restricted: alert on visitors</span>
          <span><i class="sw general"></i>General area</span>
          <span><i class="sw door"></i>Door</span>
          <span><i class="sw gate"></i>Gate</span>
          <span><i class="sw road"></i>Road / parking</span>
          <span><i class="sw dot employee"></i>Employee</span>
          <span><i class="sw dot visitor"></i>Visitor</span>
          <span><i class="sw dot driver"></i>Driver</span>
          <span><i class="sw dot guard"></i>Guard</span>
        </div>
      </section>

      <aside class="card">
        <div class="tabs" style="padding-top:14px" id="side-tabs">
          <button class="tab active" data-tab="rooms">Layout</button>
          <button class="tab" data-tab="zones">Zones</button>
          <button class="tab" data-tab="site">Site</button>
          <button class="tab" data-tab="people">People here</button>
        </div>
        <div id="side"></div>
      </aside>
    </div>
  </main>

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/live.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
